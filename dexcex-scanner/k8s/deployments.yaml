spec:
  replicas: 1
  selector:
    matchLabels:
      app: spread-engine
  template:
    metadata:
      labels:
        app: spread-engine
    spec:
      containers:
        - name: spread-engine
          image: dexcex-spread-engine:latest
          env:
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: dexcex-config
                  key: NATS_URL
            - name: REGISTRY_URL
              value: "http://token-registry:8089"
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
