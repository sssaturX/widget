---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex-indexer
  namespace: dexcex-scanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex-indexer
  template:
    metadata:
      labels:
        app: dex-indexer
    spec:
      containers:
        - name: dex-indexer
          image: dexcex-dex-indexer:latest
          envFrom:
            - configMapRef:
                name: dexcex-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dex-indexer
  namespace: dexcex-scanner
spec:
  selector:
    app: dex-indexer
  ports:
    - port: 8088
      targetPort: 8088
  type: ClusterIP
