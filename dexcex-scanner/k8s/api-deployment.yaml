apiVersion: apps/v1
kind: Deployment
metadata:
  name: dexcex-api
  namespace: dexcex-scanner
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dexcex-api
  template:
    metadata:
      labels:
        app: dexcex-api
    spec:
      containers:
        - name: api
          image: dexcex-api:latest
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: dexcex-config
                  key: NATS_URL
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dexcex-api
  namespace: dexcex-scanner
spec:
  selector:
    app: dexcex-api
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
